<!doctype html>
<html><head><meta charset="utf-8"></head>
<body>
<div id="stage"></div>
<script src="scaffolding-min.js"></script>
<script>
// Mirrors how a TurboWarp-style export wires things up: scaffolding builds the VM, and the
// VM ends up reachable as a global (TurboWarp documents `vm` as the conventional one).
(async () => {
  const scaffolding = new Scaffolding.Scaffolding();
  scaffolding.width = 480; scaffolding.height = 360;
  scaffolding.setup();
  scaffolding.appendTo(document.getElementById('stage'));
  const buf = await (await fetch('project.sb3')).arrayBuffer();
  await scaffolding.loadProject(buf);
  window.vm = scaffolding.vm;
  scaffolding.start();
  scaffolding.vm.greenFlag();
})();
</script>
</body></html>
